<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Python Pro Level Instructor Exam{% endblock %}</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Extra styling to ensure Tailwind works properly -->
    <style type="text/tailwindcss">
        @layer utilities {
            .container {
                @apply max-w-6xl mx-auto px-4;
            }
            .btn {
                @apply px-4 py-2 rounded font-medium focus:outline-none transition duration-150 ease-in-out;
            }
            .btn-blue {
                @apply bg-blue-500 text-white hover:bg-blue-600;
            }
            .btn-green {
                @apply bg-green-500 text-white hover:bg-green-600;
            }
            .btn-red {
                @apply bg-red-500 text-white hover:bg-red-600;
            }
            .btn-purple {
                @apply bg-purple-500 text-white hover:bg-purple-600;
            }
            .btn-yellow {
                @apply bg-yellow-500 text-white hover:bg-yellow-600;
            }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-white shadow-md">
        <nav class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <a href="{{ url_for('main.index') }}" class="text-2xl font-bold text-blue-600">Python Pro Exam</a>
                <div class="flex items-center space-x-4">
                    {% if current_user.is_authenticated %}
                        <span class="text-gray-700">Welcome, {{ current_user.username }}</span>
                        <a href="{{ url_for('auth.logout') }}" class="btn btn-red">Logout</a>
                    {% else %}
                        <a href="{{ url_for('auth.login') }}" class="btn btn-blue">Login</a>
                        <a href="{{ url_for('auth.register') }}" class="btn btn-green">Register</a>
                    {% endif %}
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-6">
        <div class="container mx-auto px-4">
            <div class="text-center">
                <p class="text-sm">Created by Python Pro Level Instructor Team</p>
                <p class="text-xs mt-2">© 2024 All rights reserved</p>
            </div>
        </div>
    </footer>
</body>
</html>
