{% extends "base.html" %}

{% block title %}Server Error{% endblock %}

{% block content %}
<div style="max-width: 36rem; margin-left: auto; margin-right: auto; text-align: center; padding-top: 4rem; padding-bottom: 4rem;">
    <div style="background-color: white; border-radius: 0.5rem; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); padding: 2rem; margin-bottom: 1.5rem;">
        <h1 style="font-size: 3.75rem; font-weight: 700; color: #ef4444; margin-bottom: 1rem;">500</h1>
        <h2 style="font-size: 1.5rem; font-weight: 600; color: #1f2937; margin-bottom: 1rem;">Server Error</h2>
        <p style="color: #4b5563; margin-bottom: 1rem;">Sorry, something went wrong and our server couldn't process your request.</p>
        <p style="color: #4b5563; margin-bottom: 1.5rem;">This error has been logged and will be reviewed by our team.</p>
        <a href="{{ url_for('main.index') }}" style="display: inline-block; background-color: #3b82f6; color: white; padding: 0.5rem 1.5rem; border-radius: 0.25rem; text-decoration: none; transition: background-color 0.2s;" onmouseover="this.style.backgroundColor='#2563eb'" onmouseout="this.style.backgroundColor='#3b82f6'">
            Back to Home
        </a>
    </div>
</div>
{% endblock %}
